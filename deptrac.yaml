deptrac:
  paths:
    - ./core

  exclude_files:
    - '#.*Test.*#'

  layers:

    - name: Kernel
      collectors:
        - type: classNameRegex
          value: ^Rombt\ThemeCore\Kernel\

    - name: Bootstrap
      collectors:
        - type: classNameRegex
          value: ^Rombt\ThemeCore\Bootstrap\

    - name: CompositionBootstrapper
      collectors:
        - type: classNameRegex
          value: ^Rombt\ThemeCore\Composition\Bootstrapper\

    - name: Composition
      collectors:
        - type: classNameRegex
          value: ^Rombt\ThemeCore\Composition\

    - name: ApplicationContext
      collectors:
        - type: classNameRegex
          value: ^Rombt\ThemeCore\Application\Context\

    - name: ExecutionRuntime
      collectors:
        - type: classNameRegex
          value: ^Rombt\ThemeCore\Runtime\Execution\

    - name: ApplicationStorage
      collectors:
        - type: classNameRegex
          value: ^Rombt\ThemeCore\Application\Storage\

  ruleset:

    Kernel:
      - Bootstrap
      - CompositionBootstrapper
      - ApplicationContext
      - ApplicationStorage

    Bootstrap:
      - CompositionBootstrapper
      - ApplicationContext
      - ApplicationStorage

    CompositionBootstrapper:
      - Composition
      - ApplicationContext
      - ExecutionRuntime

    Composition:
      - ApplicationStorage

    ApplicationContext: []

    ExecutionRuntime:
      - Composition
      - ApplicationStorage
      - ApplicationContext

  skip_violations:
    - name: Allow Composition Bootstrapper to access Registry
      from: Rombt\ThemeCore\Bootstrap\CompositionBootstrapper
      to: Rombt\ThemeCore\Composition\Registry\ServiceRegistry
